; PlatformIO — CollectData_Hardware (Unified Fall & ADL FreeRTOS Dual-Core Edition)
; ESP32 เก็บข้อมูลเซ็นเซอร์ MPU-6050 ทั้งท่าล้ม (F01-F15) และกิจวัตรปกติ (D01-D19)
; Core 1: อ่านและบันทึกข้อมูล MPU-6050 ที่ 50Hz แบบ Real-Time
; Core 0: เชื่อมต่อ Wi-Fi, รับคำสั่งจากเว็บ, ส่ง HTTP POST และสำรองข้อมูลออฟไลน์ลง SPIFFS Flash

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps = 
    adafruit/Adafruit MPU6050@^2.2.4
    adafruit/Adafruit Unified Sensor@^1.1.9
    bblanchon/ArduinoJson@^6.21.3
    tzapu/WiFiManager@^2.0.16-rc.2

build_flags = 
    -DCORE_DEBUG_LEVEL=0
