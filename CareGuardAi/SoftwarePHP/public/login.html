<!DOCTYPE html>
<html lang="th" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | CareGuard AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Kanit:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=9.0">
  <style>
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: radial-gradient(circle at top, #1a1a2e 0%, #0f0f23 100%);
      padding: 20px;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 32px;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
    }
    .login-logo {
      text-align: center;
      margin-bottom: 28px;
    }
    .login-logo .icon {
      font-size: 44px;
      margin-bottom: 8px;
    }
    .login-logo h1 {
      font-size: 24px;
      font-weight: 800;
      color: var(--accent);
      text-shadow: 0 0 12px var(--accent-glow);
    }
    .login-logo p {
      font-size: 13.5px;
      color: var(--text-secondary);
      margin-top: 4px;
    }
    .login-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 24px;
      background: var(--bg-secondary);
      padding: 4px;
      border-radius: 10px;
    }
    .login-tab-btn {
      flex: 1;
      padding: 9px;
      border-radius: 8px;
      background: transparent;
      color: var(--text-secondary);
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .login-tab-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 700;
      box-shadow: 0 0 10px var(--accent-glow);
    }
    .login-field {
      margin-bottom: 18px;
    }
    .login-error {
      background: var(--danger-bg);
      border: 1px solid var(--danger);
      color: var(--danger);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13.5px;
      margin-bottom: 16px;
      display: none;
      text-align: center;
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <div class="icon">⚡</div>
    <h1>CareGuard AI</h1>
    <p>ระบบตรวจจับการล้มและติดตามผู้ใช้งาน (Hardware1)</p>
  </div>

  <div class="login-tabs">
    <button class="login-tab-btn active" id="tabLogin" onclick="setMode('login')">เข้าสู่ระบบ</button>
    <button class="login-tab-btn" id="tabReg" onclick="setMode('register')">ลงทะเบียนใหม่</button>
  </div>

  <div class="login-error" id="loginError"></div>

  <div class="login-field">
    <label class="form-label">👤 ชื่อผู้ใช้งาน (Username)</label>
    <input class="form-input" id="username" type="text" placeholder="ระบุชื่อผู้ใช้" autofocus onkeydown="if(event.key==='Enter')document.getElementById('password').focus()">
  </div>

  <div class="login-field">
    <label class="form-label">🔒 รหัสผ่าน (Password) <span id="pwdHint" style="font-weight:400;font-size:11.5px;color:var(--text-muted);display:none;">(อย่างน้อย 4 ตัวอักษร)</span></label>
    <input class="form-input" id="password" type="password" placeholder="••••••••" onkeydown="if(event.key==='Enter')submitForm()">
  </div>

  <button class="btn btn-primary" style="width:100%;padding:12px;font-size:15px;margin-top:8px;" id="submitBtn" onclick="submitForm()">เข้าสู่ระบบ</button>

  <div style="text-align:center;margin-top:24px;font-size:12px;color:var(--text-muted);">
    CareGuard AI System v6.0 — GPS & TinyML Edition
  </div>
</div>

<script>
const BASE = window.location.pathname.replace(/\/login\.html$/, '').replace(/\/$/, '');
let mode = 'login';

// ถ้ามี ?logout=1 ให้เรียก logout API ก่อนเพื่อ destroy session ฝั่ง server
(async function() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('logout') === '1') {
    try {
      await fetch(BASE + '/api/auth/logout', { method: 'POST' });
    } catch (e) {}
    try {
      sessionStorage.removeItem('careguard_active_uid');
      localStorage.removeItem('careguard_chat_history');
    } catch (e) {}
    // ลบ ?logout=1 ออกจาก URL ให้สะอาด (ไม่ reload)
    window.history.replaceState({}, '', BASE + '/login.html');
    return; // ไม่ต้องเช็ค /me แล้ว เพราะ logout แล้ว
  }

  // ถ้าไม่ได้ logout — เช็คว่า login อยู่หรือเปล่า ถ้า login อยู่แล้วให้ redirect ไปหน้าหลัก
  try {
    const r = await fetch(BASE + '/api/auth/me');
    const d = await r.json();
    if (d.loggedIn) {
      if (d.user && d.user.id) sessionStorage.setItem('careguard_active_uid', String(d.user.id));
      window.location.href = BASE + '/index.html';
    }
  } catch (e) {}
})();

function setMode(m) {
  mode = m;
  const isL = m === 'login';
  document.getElementById('tabLogin').className = isL ? 'login-tab-btn active' : 'login-tab-btn';
  document.getElementById('tabReg').className   = !isL ? 'login-tab-btn active' : 'login-tab-btn';
  document.getElementById('submitBtn').textContent = isL ? 'เข้าสู่ระบบ' : 'สร้างบัญชีใหม่';
  document.getElementById('pwdHint').style.display  = isL ? 'none' : 'inline';
  document.getElementById('loginError').style.display = 'none';
}

async function submitForm() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value.trim();
  const errEl = document.getElementById('loginError');

  if (!u || !p) {
    errEl.textContent = 'กรุณากรอกชื่อผู้ใช้และรหัสผ่าน';
    errEl.style.display = 'block';
    return;
  }

  const endpoint = mode === 'login' ? '/api/auth/login' : '/api/auth/register';
  try {
    const res = await fetch(BASE + endpoint, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: u, password: p })
    });
    const data = await res.json();
    if (data.success) {
      if (data.user && data.user.id) {
        sessionStorage.setItem('careguard_active_uid', String(data.user.id));
      }
      window.location.href = BASE + (mode === 'register' ? '/index.html?setup=1' : '/index.html');
    } else {
      errEl.textContent = data.error || 'เข้าสู่ระบบไม่สำเร็จ';
      errEl.style.display = 'block';
    }
  } catch (e) {
    errEl.textContent = 'เกิดข้อผิดพลาดในการเชื่อมต่อ Server';
    errEl.style.display = 'block';
  }
}
</script>
</body>
</html>
